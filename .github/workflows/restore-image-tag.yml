name: Restore image tag

# Repoints a moving image tag at an immutable version already in the registry.
#
# It exists because of a specific incident, and the incident is worth stating in full since this
# workflow is otherwise a strange thing to find in a repository that has sworn off moving tags.
#
# The frozen v1.0.x action is a Docker action. Its action.yml pulls
# `docker://ghcr.io/vikoit/reversibility-engine:v1` and sets no `entrypoint:` and no `args:`, so
# it runs whatever the image declares as its ENTRYPOINT. At 1.0.2 that was entrypoint.sh, which
# performed the analysis. The v1.1.0 image replaced it with revctl itself — and revctl invoked
# with no arguments printed help and exited 0. Publishing v1.1.0 as `:v1` therefore turned every
# existing @v1 consumer's gate into a green check over no analysis whatsoever.
#
# `:v1` must go back to the 1.0.2 manifest, and it must happen from a runner rather than from
# somebody's laptop: a registry mutation that decides whether other people's gates work should
# leave an audit trail and be repeatable by anyone with the permission, not depend on a local
# Docker daemon and a personal access token.
#
# `imagetools create` copies a manifest between tags inside the registry. Nothing is pulled,
# nothing is rebuilt, and no new digest is produced — the alias ends up pointing at bytes that
# were already published and already verified, which is the only kind of repair worth trusting.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Immutable image tag to copy FROM (e.g. 1.0.2). Must already exist.'
        required: true
        default: '1.0.2'
      alias:
        description: 'Moving tag to repoint (e.g. v1).'
        required: true
        default: 'v1'
      expect-entrypoint:
        description: >-
          The ENTRYPOINT the restored alias must declare. This is the property that actually
          broke, so it is asserted rather than assumed. Leave empty to skip the assertion.
        required: false
        default: '/usr/local/bin/entrypoint.sh'

permissions:
  contents: read
  packages: write
  # The CI gate reads workflow runs.
  actions: read

# Two of these running at once would race to define what the alias means, and the loser would
# win. Never cancel a run in progress: a half-applied tag move is worse than a late one.
concurrency:
  group: restore-image-tag
  cancel-in-progress: false

jobs:
  restore:
    name: Repoint ${{ inputs.alias }} at ${{ inputs.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # IMAGE is set by the normalisation step below, not here: it needs lowercasing and
      # GitHub expressions cannot do it.
      SOURCE: ${{ inputs.source }}
      ALIAS: ${{ inputs.alias }}
      EXPECT_ENTRYPOINT: ${{ inputs.expect-entrypoint }}

    steps:
      - uses: actions/checkout@v4

      # THE IMAGE REFERENCE MUST BE LOWERCASE, AND github.repository IS NOT.
      #
      # This owner is `VIKOIT`, so `ghcr.io/${{ github.repository }}` expands to
      # `ghcr.io/VIKOIT/reversibility-engine`, and a Docker repository name may not contain
      # uppercase. Every `imagetools` call in this workflow therefore failed on the first one:
      #
      #     ERROR: invalid reference format: repository name (VIKOIT/reversibility-engine)
      #            must be lowercase
      #
      # **This workflow had never once run to completion.** That is why the incident it was
      # written to repair was still live: not because nobody dispatched it, but because it could
      # not succeed if they did. A repair that exists is not a repair that ran -- and this one
      # could not run. See docs/SPECIFICATION.md §2 and §16.20.
      #
      # publish-image.yml is unaffected and always was, which is exactly why this went unseen:
      # docker/metadata-action lowercases the image name for you. A raw imagetools call does not,
      # and the two sat in the same repository looking equally correct.
      #
      # GitHub's expression language has no lower(), so this is a step rather than an `env:`.
      - name: Normalise the image reference to lowercase
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # Asserted rather than assumed: if this is ever not lowercase, every later step fails
          # with a registry error that reads as a broken tag rather than a broken workflow.
          case "$image" in
            *[A-Z]*)
              echo "::error::image reference '$image' still contains uppercase after normalisation."
              exit 1
              ;;
          esac

          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "Image reference: $image"

      # This workflow can point a production tag at anything, and until now it did so with less
      # protection than the release path it exists to repair: `packages: write`, no CI gate, and
      # no constraint on either input. A repair tool that can cause the damage it repairs is not
      # a repair tool.
      #
      # CI_GATE_EVENTS names `workflow_dispatch` explicitly, because that is the only thing this
      # workflow can ever be. The gate's default is `push` alone and the allowlist is the
      # documented way to widen it at a call site -- see .github/scripts/require-green-ci.sh.
      - name: Require a successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          CI_GATE_EVENTS: workflow_dispatch
        run: bash .github/scripts/require-green-ci.sh "${{ github.sha }}"

      # THE SOURCE MUST BE AN IMMUTABLE VERSION TAG, AND THE ALIAS MUST NOT BE ONE.
      #
      # `imagetools create` will happily copy any tag onto any other. Without this, one typo in a
      # dispatch form could point `v1` at another moving alias -- so the alias would inherit
      # whatever that one later became, silently, which is the entire class of defect this
      # repository has spent six investigations removing. Worse, the inputs are free text on a
      # form, filled in by a person who is mid-incident.
      #
      # Immutable means MAJOR.MINOR.PATCH with no `v` and no suffix, which is exactly what
      # publish-image.yml emits for `type=semver,pattern={{version}}`. Anything else -- `v1`,
      # `v1.2`, `latest`, a digest, a prerelease -- is refused as a source.
      - name: The source must be immutable and the alias must not be
        run: |
          set -euo pipefail

          case "$SOURCE" in
            *[!0-9.]*|''|*..*|.*|*.)
              echo "::error::source '$SOURCE' is not an immutable version tag. It must be MAJOR.MINOR.PATCH exactly -- no 'v' prefix, no suffix, no moving alias. Copying from a moving tag would make '$ALIAS' inherit whatever that tag later becomes, which is the fail-open this workflow exists to repair."
              exit 1
              ;;
          esac

          # Three dot-separated numeric fields, checked by counting rather than by a regex, so the
          # rule stays readable: 1.0.2 passes, 1.0 and 1.0.2.3 do not.
          fields="$(printf '%s' "$SOURCE" | tr '.' ' ' | wc -w | tr -d ' ')"
          if [ "$fields" != '3' ]; then
            echo "::error::source '$SOURCE' has $fields dot-separated field(s); an immutable version tag has exactly 3 (MAJOR.MINOR.PATCH)."
            exit 1
          fi

          # And the alias must be a moving one. Repointing an immutable tag would break the single
          # promise this project makes about published artifacts: a pinned version stays the bytes
          # it was.
          case "$ALIAS" in
            *[!0-9.]*) ;;
            *)
              echo "::error::alias '$ALIAS' looks like an immutable version tag. Immutable tags are never repointed -- that is the promise a pinned version rests on. The alias is a moving tag such as 'v1' or 'v1.2'."
              exit 1
              ;;
          esac

          echo "source '$SOURCE' is immutable; alias '$ALIAS' is a moving tag."

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolved before anything is changed. A source tag that does not exist would otherwise
      # produce an alias pointing at nothing, which fails at pull time in somebody else's
      # pipeline rather than here.
      - name: Resolve the source digest
        id: source
        run: |
          set -euo pipefail

          if ! digest="$(docker buildx imagetools inspect "$IMAGE:$SOURCE" --format '{{.Manifest.Digest}}' 2>&1)"; then
            echo "::error::$IMAGE:$SOURCE could not be inspected. Nothing was changed."
            printf '%s\n' "$digest"
            exit 1
          fi

          echo "$IMAGE:$SOURCE is $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Recorded so the run itself says what it replaced. A repair with no record of the prior
      # state is not auditable, and the whole point of doing this from a workflow is the record.
      - name: Record what the alias points at now
        id: before
        run: |
          set -euo pipefail

          if digest="$(docker buildx imagetools inspect "$IMAGE:$ALIAS" --format '{{.Manifest.Digest}}' 2> /dev/null)"; then
            echo "$IMAGE:$ALIAS currently is $digest"
          else
            digest='(absent)'
            echo "$IMAGE:$ALIAS does not currently exist; it will be created."
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Repoint the alias
        if: steps.before.outputs.digest != steps.source.outputs.digest
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:$ALIAS" "$IMAGE:$SOURCE"

      # Read back rather than assumed. A tag that quietly did not move is the same failure this
      # workflow exists to repair, so the run does not go green on the strength of a command
      # that exited zero.
      - name: Verify the alias resolves to the source
        id: verify
        run: |
          set -euo pipefail

          want='${{ steps.source.outputs.digest }}'
          got="$(docker buildx imagetools inspect "$IMAGE:$ALIAS" --format '{{.Manifest.Digest}}')"

          if [ "$got" != "$want" ]; then
            echo "::error::$IMAGE:$ALIAS is $got, expected $want."
            exit 1
          fi

          echo "$IMAGE:$ALIAS resolves to $got."
          echo "digest=$got" >> "$GITHUB_OUTPUT"

      # The digest match proves the alias points at the right bytes. This proves those bytes
      # behave the way the frozen Docker action needs them to — which is the actual requirement,
      # and the one the digest alone does not express to a reader.
      - name: Verify the restored ENTRYPOINT
        if: inputs.expect-entrypoint != ''
        run: |
          set -euo pipefail

          docker pull --quiet "$IMAGE:$ALIAS"
          got="$(docker image inspect "$IMAGE:$ALIAS" --format '{{json .Config.Entrypoint}}')"

          case "$got" in
            *"$EXPECT_ENTRYPOINT"*)
              echo "ENTRYPOINT is $got, as required."
              ;;
            *)
              echo "::error::$IMAGE:$ALIAS declares ENTRYPOINT $got, expected it to contain '$EXPECT_ENTRYPOINT'."
              echo "::error::The frozen Docker action runs this entrypoint with no arguments. The wrong one here is the fail-open this workflow exists to repair."
              exit 1
              ;;
          esac

      - name: Summarise
        if: always()
        run: |
          {
            echo "### \`$ALIAS\` → \`$SOURCE\`"
            echo
            echo "| | Digest |"
            echo "| --- | --- |"
            echo "| \`$ALIAS\` before | \`${{ steps.before.outputs.digest }}\` |"
            echo "| \`$SOURCE\` | \`${{ steps.source.outputs.digest }}\` |"
            echo "| \`$ALIAS\` after | \`${{ steps.verify.outputs.digest || '(not verified)' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
