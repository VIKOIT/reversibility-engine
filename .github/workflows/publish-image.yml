name: Publish action image

# A Docker action with `image: Dockerfile` rebuilds itself on every consumer run, and
# pg_query_go compiles a large C library — minutes of every pull request, in every repo that
# uses this action. Publishing the image once per release moves that cost here.
on:
  push:
    # Full versions only. A moving major tag like v1 is not a semver string, so the tag
    # derivation below would produce nothing and the push would fail on an empty tag list —
    # and there would be nothing to build anyway: the release that moved v1 already published
    # the image, including its own moving v1 image tag.
    tags: ['v*.*.*']

# NO workflow_dispatch. There is one way to publish and it is pushing a tag.
#
# The manual trigger was removed rather than left to fail. `require-green-ci.sh` is permitted for
# `push` alone, so a dispatch run would have died at the guard with a message about head_sha --
# a true message, and a confusing one, discovered by somebody who had already decided to publish
# by hand. A trigger that is present but cannot succeed is a documented path that isn't one.
#
# It also removes the shape this workflow exists to prevent. A manual publish is the moment
# somebody is working around a process, which is exactly the moment the process was protecting
# them. If a release must go out, the way to do it is to make CI green and push a tag.

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      # The same gate the release workflow uses, for the same reason: this workflow publishes,
      # and nothing is published over a red CI. It runs before the build because a 45-minute
      # cgo image build over a failing test suite is 45 minutes spent to produce something that
      # must not ship.
      - name: Require a successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-green-ci.sh "${{ github.sha }}"

      # ONE PRODUCER. Both this workflow and publish-image.yml derive the image reference from
      # .github/scripts/image-ref.sh, which lowercases it and validates it against the registry's
      # own naming rules before anything uses it.
      #
      # They used to derive it separately: publish-image.yml handed the raw expression to
      # docker/metadata-action, which lowercases internally, and this workflow built the string by
      # hand and handed it to imagetools, which does not. Same input, same intended value, two
      # producers -- §13's rule, and the reason this workflow had never run to completion.
      - name: Derive the image reference
        run: bash .github/scripts/image-ref.sh

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The v-prefix is kept on the moving tags so an image tag reads the same as the git tag
      # a consumer writes after the @. ghcr.io/<owner>/<repo>:v1 pairs with @v1; a bare "1"
      # would be one more thing to translate at the moment someone is debugging a pin.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # From the shared producer above, not re-derived here. metadata-action would lowercase
          # this for you, and that silent kindness is exactly what hid the defect: the workflow
          # that did not get it was broken for its entire life and looked identical.
          images: ${{ env.IMAGE }}
          # NO MOVING MAJOR TAG. `:v1` is not a convenience alias here — it is wired into the
          # frozen v1 Docker action, whose action.yml at the v1 git tag pulls
          # `docker://ghcr.io/vikoit/reversibility-engine:v1` and runs the image's ENTRYPOINT.
          #
          # That entrypoint used to be entrypoint.sh, which did the analysis. It is now revctl
          # itself, and revctl invoked with no arguments prints help and exits 0 — so publishing
          # a v1.1.0 image as `:v1` silently turned every `@v1` consumer's gate into a green
          # check over no analysis at all. Exactly the fail-open this product exists to prevent,
          # introduced by a tag pattern rather than by any rule.
          #
          # Immutable version tags only. A moving alias for the image may come back when nothing
          # consumes it as an action entrypoint, and not before.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      # BUILT AND LOADED, NOT PUSHED. The push is the last step in this job, after both
      # verifications below have passed.
      #
      # This used to push here, and the two checks below ran against an image that was already
      # in the registry. They are the checks written specifically to prevent the `:v1` incident
      # — has the image lost its cgo parser, does its no-argument run exit 0 — and they could
      # not prevent anything, because a failing check turned the workflow red and left the
      # broken image published. A red workflow is not visible to somebody running `docker pull`.
      #
      # **Nothing reaches "published" without proving what it published.** An artifact that is
      # visible before it is verified has been published; the verification is then a report, not
      # a gate. See docs/SPECIFICATION.md §2.
      - name: Build and load
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Single-platform, so the image can be loaded into the runner's daemon and actually
          # executed. Verifying a manifest list would mean verifying nothing you can run.
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

          # linux/amd64 only, and deliberately so. Every GitHub-hosted Linux runner is amd64,
          # and cgo under QEMU turns the pg_query build into a half-hour emulated compile.
          # Adding linux/arm64 means a second native runner and a manifest merge — worth doing
          # when someone actually needs it, not before.
          platforms: linux/amd64

          # THE REQUIREMENT IS THE ENTRYPOINT, NOT THE MANIFEST SHAPE.
          #
          # This comment used to say that a Docker action needs a plain image reference and that
          # a manifest list is a shape to avoid. That was wrong as stated, and `:v1` proved it:
          # repointing it with `imagetools create` wrapped the 1.0.2 manifest in an OCI index, so
          # the tag a frozen Docker action pulls *is* an index now — and it resolves and runs
          # correctly, because Docker resolves a single-platform index like any other reference.
          #
          # What actually has to hold is one thing: **the reference a Docker action pulls must
          # resolve to a config whose ENTRYPOINT analyzes.** That is the property the v1.1.0
          # incident violated, and manifest shape is an implementation detail of whichever tool
          # last wrote the tag. Asserted end to end by action-selftest.yml.
          #
          # provenance stays false for its own reason: an attestation entry adds a manifest this
          # image has no consumer for, and the build is single-platform. Not a correctness claim.
          provenance: false

      # The image is the product now, so it is checked the way the build stage checks itself:
      # if the artifact cannot classify a DROP TABLE, it lost its cgo parser and would grade
      # every migration as unanalyzed. It is checked here, loaded and not yet pushed, so a
      # failure means nothing was published rather than something broken was.
      #
      # --entrypoint is passed explicitly. The image declares one, but relying on it is what
      # broke v1.1.0: a consumer that inherits an entrypoint inherits whatever the entrypoint
      # became, and the change from entrypoint.sh to revctl was invisible at every call site
      # that did not name it. Nothing in this repository invokes this image implicitly again.
      - name: Verify the image still classifies SQL, before it is published
        run: |
          set -euo pipefail
          image="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n 1)"
          echo "Verifying $image"
          printf 'DROP TABLE t;\n' > probe.sql

          docker run --rm \
            --volume "$PWD:/probe" --workdir /probe \
            --entrypoint /usr/local/bin/revctl \
            "$image" check probe.sql --format json > probe.json

          if ! grep -q '"PG001"' probe.json; then
            echo "::error::the image did not classify DROP TABLE as PG001 — it has lost its cgo parser. Nothing was pushed."
            cat probe.json
            exit 1
          fi
          echo "Image classifies SQL correctly."

      # The assertion that would have caught the v1.1.0 incident before it was published.
      #
      # The frozen v1.0.x Docker action runs this image's ENTRYPOINT with no arguments of its
      # own. When that entrypoint became revctl — which printed help and exited 0 — the action
      # reported a passing gate having analyzed nothing. The grade was never wrong; there was
      # simply no grade, and no grade read as success.
      #
      # An image whose default invocation exits 0 is therefore an image that can silently
      # replace a gate with a green check, and it does not get published -- which is now true
      # in the literal sense, because the push happens after this step rather than before it.
      - name: Verify that running the image with no arguments is not a pass
        run: |
          set -euo pipefail
          image="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n 1)"

          set +e
          docker run --rm "$image" > noargs.txt 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "::error::$image exits 0 when run with no arguments. A run that analyzed nothing must never report success — this is the v1.1.0 fail-open."
            cat noargs.txt
            exit 1
          fi

          echo "No-argument invocation exits $rc, as it must."

      # Only now. Every tag is pushed from the image that just passed both checks, and the
      # build is a cache hit — it is the same layers, re-resolved and uploaded.
      #
      # A partial failure here can still leave one tag pushed and another not, which is why the
      # version tag is pushed before the minor alias: a consumer pinning the exact version gets
      # a complete image or nothing, and the alias only ever points at something already up.
      - name: Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          platforms: linux/amd64
          provenance: false

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            printf '%s\n' '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
