name: Publish action image

# A Docker action with `image: Dockerfile` rebuilds itself on every consumer run, and
# pg_query_go compiles a large C library — minutes of every pull request, in every repo that
# uses this action. Publishing the image once per release moves that cost here.
on:
  push:
    # Full versions only. A moving major tag like v1 is not a semver string, so the tag
    # derivation below would produce nothing and the push would fail on an empty tag list —
    # and there would be nothing to build anyway: the release that moved v1 already published
    # the image, including its own moving v1 image tag.
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The v-prefix is kept on the moving tags so an image tag reads the same as the git tag
      # a consumer writes after the @. ghcr.io/<owner>/<repo>:v1 pairs with @v1; a bare "1"
      # would be one more thing to translate at the moment someone is debugging a pin.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # NO MOVING MAJOR TAG. `:v1` is not a convenience alias here — it is wired into the
          # frozen v1 Docker action, whose action.yml at the v1 git tag pulls
          # `docker://ghcr.io/vikoit/reversibility-engine:v1` and runs the image's ENTRYPOINT.
          #
          # That entrypoint used to be entrypoint.sh, which did the analysis. It is now revctl
          # itself, and revctl invoked with no arguments prints help and exits 0 — so publishing
          # a v1.1.0 image as `:v1` silently turned every `@v1` consumer's gate into a green
          # check over no analysis at all. Exactly the fail-open this product exists to prevent,
          # introduced by a tag pattern rather than by any rule.
          #
          # Immutable version tags only. A moving alias for the image may come back when nothing
          # consumes it as an action entrypoint, and not before.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

          # linux/amd64 only, and deliberately so. Every GitHub-hosted Linux runner is amd64,
          # and cgo under QEMU turns the pg_query build into a half-hour emulated compile.
          # Adding linux/arm64 means a second native runner and a manifest merge — worth doing
          # when someone actually needs it, not before.
          platforms: linux/amd64

          # A Docker action pulls this reference directly. Provenance would turn it into a
          # manifest list carrying an attestation entry, which is a shape the plain image
          # reference does not need and some registry tooling mis-reports.
          provenance: false

      # The image is the product now, so it is checked the way the build stage checks itself:
      # if the published artifact cannot classify a DROP TABLE, it lost its cgo parser and
      # would grade every migration as unanalyzed.
      #
      # --entrypoint is passed explicitly. The image declares one, but relying on it is what
      # broke v1.1.0: a consumer that inherits an entrypoint inherits whatever the entrypoint
      # became, and the change from entrypoint.sh to revctl was invisible at every call site
      # that did not name it. Nothing in this repository invokes this image implicitly again.
      - name: Verify the published image still classifies SQL
        run: |
          set -euo pipefail
          image="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n 1)"
          echo "Verifying $image"
          printf 'DROP TABLE t;\n' > probe.sql

          docker run --rm \
            --volume "$PWD:/probe" --workdir /probe \
            --entrypoint /usr/local/bin/revctl \
            "$image" check probe.sql --format json > probe.json

          if ! grep -q '"PG001"' probe.json; then
            echo "::error::the published image did not classify DROP TABLE as PG001 — it has lost its cgo parser"
            cat probe.json
            exit 1
          fi
          echo "Image classifies SQL correctly."

      # The assertion that would have caught the v1.1.0 incident before it was published.
      #
      # The frozen v1.0.x Docker action runs this image's ENTRYPOINT with no arguments of its
      # own. When that entrypoint became revctl — which printed help and exited 0 — the action
      # reported a passing gate having analyzed nothing. The grade was never wrong; there was
      # simply no grade, and no grade read as success.
      #
      # An image whose default invocation exits 0 is therefore an image that can silently
      # replace a gate with a green check, and it does not get published.
      - name: Verify that running the image with no arguments is not a pass
        run: |
          set -euo pipefail
          image="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n 1)"

          set +e
          docker run --rm "$image" > noargs.txt 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "::error::$image exits 0 when run with no arguments. A run that analyzed nothing must never report success — this is the v1.1.0 fail-open."
            cat noargs.txt
            exit 1
          fi

          echo "No-argument invocation exits $rc, as it must."

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            printf '%s\n' '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
