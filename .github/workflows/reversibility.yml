name: Reversibility

# This repository gates itself with its own published action rather than with a local build.
# Dogfooding is the only way the packaged path -- image pull, container entrypoint, two-tree
# staging, comment posting -- gets exercised before a consumer exercises it for us.
#
# A pull request from a fork receives a read-only GITHUB_TOKEN, so the gate still runs but the
# certificate cannot be posted. pull_request_target would fix that and is deliberately not used:
# it runs the base branch's workflow with write access to untrusted code.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reversibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Reversibility certificate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The action diffs against the pull request's base commit, which a shallow clone
          # does not contain.
          fetch-depth: 0

      - id: certify
        uses: VIKOIT/reversibility-engine@v1
        with:
          min-grade: B

          # testdata holds deliberately destructive fixtures -- 27 Postgres rules and 15
          # Kubernetes rules, most of which are meant to grade F. Analyzing them would gate
          # this repository on its own test corpus.
          #
          # .github and action.yml are YAML that was never a Kubernetes manifest. The analyzer
          # cannot tell that from a manifest it failed to read and reports K8S014/UNKNOWN for
          # both, which is the correct fail-closed answer and the reason to scope what it sees.
          exclude: 'testdata/** .github/** action.yml'

      # The certificate is kept even when the gate fails: it is the artifact that explains why.
      - if: always() && steps.certify.outputs.certificate != ''
        uses: actions/upload-artifact@v4
        with:
          name: reversibility-certificate
          path: reversibility-certificate.md
          if-no-files-found: ignore
