name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-negotiable. The Postgres analyzer links the real PostgreSQL parser through cgo;
  # a CGO_ENABLED=0 build would drop it silently. See ADR/0001-parser-choice.md.
  CGO_ENABLED: "1"
  GO_VERSION: "1.22"

jobs:
  # Rule 1 of docs/SPECIFICATION.md §6 is mechanically checkable, so it is checked mechanically
  # rather than trusted to review.
  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: internal/domain must import only stdlib
        run: sh scripts/check-domain-imports.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    name: Test (race)
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL instance, so the snapshot collector is tested against a real
    # database rather than a mock. The test that matters here asserts that a database seeded
    # with obviously-sensitive values produces a snapshot containing none of them — "metadata
    # only" is the whole basis on which anybody points this at production, and reviewing the
    # queries by eye is not enough to keep it true.
    #
    # These tests skip when the variable is unset, which is what makes a local `go test ./...`
    # work without Docker.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: throwaway-not-a-real-secret
          POSTGRES_DB: revctl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go test -race -count=1 ./...
        env:
          REVCTL_TEST_POSTGRES_DSN: postgres://postgres:throwaway-not-a-real-secret@localhost:5432/revctl_test?sslmode=disable

      # A skipped test passes, so the one test this service exists for is confirmed to have
      # actually run rather than quietly skipped past a broken service container.
      - name: The redaction test must have run, not skipped
        env:
          REVCTL_TEST_POSTGRES_DSN: postgres://postgres:throwaway-not-a-real-secret@localhost:5432/revctl_test?sslmode=disable
        run: |
          set -euo pipefail
          go test -count=1 -run TestSnapshotContainsNoUserData -v ./internal/snapshot/collect/ | tee out.txt
          grep -q -- '--- PASS: TestSnapshotContainsNoUserData' out.txt

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # A short burst per target on every pull request. This is a smoke test, not a campaign:
      # it re-runs the committed seed corpus and explores a little further, which is what catches
      # a regression in the parser's complexity guard before it reaches a server. Long campaigns
      # belong on a schedule, not in the merge path.
      - name: Fuzz every target briefly
        run: sh scripts/fuzz.sh 20s

      # A crasher Go writes under testdata/fuzz is a reproducer worth keeping, so it is surfaced
      # rather than discarded with the runner.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Cover internal/analyzer and internal/engine
        run: |
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out \
            ./internal/analyzer/... ./internal/engine/...
      - name: Enforce 85% gate
        run: sh scripts/coverage.sh coverage.out 85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: ignore
