name: Action

# Exercises the composite action itself against this repository's own fixtures.
#
# The engine's unit tests prove the analyzers are right. They say nothing about whether the
# packaging around them works: the ref detection, the pathspec plumbing, the JSON the outputs
# are read from, the exit code the job is graded on. That path is what a consumer actually
# runs, and until this workflow existed it was only ever exercised by consumers.
#
# The binary comes from a local build rather than a release download, because the point is to
# test the action against the code in the pull request. The download and checksum path is
# exercised by the release workflow and by every real consumer.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # The gold-standard reversible migration: this is the fixture that proves an A is
          # reachable at all, so if it stops being one the gate has become unusable.
          - name: 'a reversible migration grades A'
            fixture: testdata/fixtures/postgres/PG024_create_index_concurrently/migrations
            grade: 'A'
            gate-status: 'PASS'
            findings: '1'
          - name: 'a dropped table grades F'
            fixture: testdata/fixtures/postgres/PG001_drop_table/migrations
            grade: 'F'
            gate-status: 'FAIL'
            findings: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          # The action compares against a base commit, which a shallow clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build revctl
        env:
          CGO_ENABLED: '1'
        run: go build -o "$RUNNER_TEMP/revctl" ./cmd/revctl

      # The action analyzes a range of commits, so the fixture has to arrive as one. Committing
      # it locally and never pushing gives the action exactly the shape of input it sees in a
      # real pull request.
      - name: Stage the fixture as a commit
        run: |
          set -euo pipefail
          git config user.name 'Action Self Test'
          git config user.email 'selftest@example.invalid'
          mkdir -p .selftest
          cp "${{ matrix.fixture }}"/*.sql .selftest/
          git add .selftest
          git commit --quiet --message 'test: stage a fixture for the action self test'
          git --no-pager show --stat --oneline HEAD

      - id: certify
        uses: ./
        with:
          binary: ${{ runner.temp }}/revctl
          base: HEAD~1
          path: .selftest
          gate: A
          # The destructive case is expected to grade F, and a self test that failed its own
          # job could not then assert anything about the outputs.
          fail-on-gate: false
          comment: false

      - name: Assert the certificate
        env:
          GOT_GRADE: ${{ steps.certify.outputs.grade }}
          GOT_GATE: ${{ steps.certify.outputs.gate-status }}
          GOT_FINDINGS: ${{ steps.certify.outputs.findings-count }}
          GOT_PATH: ${{ steps.certify.outputs.certificate-path }}
          WANT_GRADE: ${{ matrix.grade }}
          WANT_GATE: ${{ matrix.gate-status }}
          WANT_FINDINGS: ${{ matrix.findings }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 = '$2', want '$3'"
              failed=1
            else
              echo "$1 = $2"
            fi
          }

          check 'grade'          "$GOT_GRADE"    "$WANT_GRADE"
          check 'gate-status'    "$GOT_GATE"     "$WANT_GATE"
          check 'findings-count' "$GOT_FINDINGS" "$WANT_FINDINGS"

          if [ ! -s "$GOT_PATH" ]; then
            echo "::error::certificate-path '$GOT_PATH' is missing or empty"
            failed=1
          fi

          exit "$failed"

  gate-fails-the-job:
    name: the gate fails the job it is meant to block
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build revctl
        env:
          CGO_ENABLED: '1'
        run: go build -o "$RUNNER_TEMP/revctl" ./cmd/revctl

      - name: Stage a destructive migration as a commit
        run: |
          set -euo pipefail
          git config user.name 'Action Self Test'
          git config user.email 'selftest@example.invalid'
          mkdir -p .selftest
          cp testdata/fixtures/postgres/PG001_drop_table/migrations/*.sql .selftest/
          git add .selftest
          git commit --quiet --message 'test: stage a destructive fixture'

      # An action that reports F and exits zero is not a gate. This is the assertion that the
      # exit code, not just the output, does its job.
      - id: certify
        continue-on-error: true
        uses: ./
        with:
          binary: ${{ runner.temp }}/revctl
          base: HEAD~1
          path: .selftest
          gate: A
          comment: false

      - name: Assert the step failed
        run: |
          set -euo pipefail
          if [ '${{ steps.certify.outcome }}' != 'failure' ]; then
            echo '::error::A grade F change did not fail the job. The gate does not gate.'
            exit 1
          fi
          echo 'Grade F failed the job, as it must.'

  analyzing-nothing-is-not-a-pass:
    name: an invocation that analyzes nothing fails
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The regression test for the v1.1.0 incident, and the one that would have caught it before
    # publish.
    #
    # Nothing about that failure was a wrong grade. There was no grade. The frozen v1.0.x Docker
    # action runs the image's ENTRYPOINT with no arguments of its own; that entrypoint changed
    # from a script that did the analysis to revctl itself, and revctl with no arguments printed
    # help and exited 0. Every @v1 consumer's gate became a green check over nothing.
    #
    # `gate-fails-the-job` above proves a bad change fails. This proves *no* change fails too —
    # which is the harder half, because a gate that never runs looks exactly like a gate that
    # found nothing wrong.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build revctl
        env:
          CGO_ENABLED: '1'
        run: go build -o "$RUNNER_TEMP/revctl" ./cmd/revctl

      - name: The binary with no arguments exits 2
        run: |
          set -euo pipefail

          set +e
          "$RUNNER_TEMP/revctl" > out.txt 2> err.txt
          rc=$?
          set -e

          if [ "$rc" -ne 2 ]; then
            echo "::error::revctl with no arguments exited $rc, want 2. A run that analyzed nothing must never report success."
            cat out.txt err.txt
            exit 1
          fi

          # stdout is where a certificate goes. Usage text there would be read as output by
          # anything redirecting it to a file.
          if [ -s out.txt ]; then
            echo '::error::revctl with no arguments wrote to stdout, which is reserved for the certificate.'
            cat out.txt
            exit 1
          fi

          echo 'Bare invocation exits 2 with help on stderr, as it must.'

      - name: Asking for help is still a success
        run: |
          set -euo pipefail
          # Separated deliberately. If `--help` were also non-zero, every Makefile and container
          # HEALTHCHECK that calls it would break, users would learn to ignore this exit code,
          # and the assertion above would stop protecting anything.
          "$RUNNER_TEMP/revctl" --help > /dev/null
          "$RUNNER_TEMP/revctl" help > /dev/null
          echo 'Help exits 0, as it must.'

      - uses: docker/setup-buildx-action@v3

      # Built here rather than pulled, so the assertion covers the image this commit *would*
      # publish rather than one already in the registry. Catching it at publish time is too late:
      # the tag is what consumers resolve, and by then it has moved.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reversibility-engine:selftest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image with no arguments is not a pass
        run: |
          set -euo pipefail

          set +e
          docker run --rm reversibility-engine:selftest > image-out.txt 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo '::error::The image exits 0 when run with no arguments. A Docker action that names no entrypoint would report a passing gate having analyzed nothing — this is the v1.1.0 fail-open.'
            cat image-out.txt
            exit 1
          fi

          echo "Image with no arguments exits $rc, as it must."

      - name: The image still classifies SQL when told what to do
        run: |
          set -euo pipefail
          printf 'DROP TABLE t;\n' > probe.sql

          # --entrypoint is named explicitly. The image declares one, and inheriting it is the
          # habit that made the incident invisible at every call site.
          docker run --rm \
            --volume "$PWD:/probe" --workdir /probe \
            --entrypoint /usr/local/bin/revctl \
            reversibility-engine:selftest check probe.sql --format json > probe.json

          if ! grep -q '"PG001"' probe.json; then
            echo '::error::the image did not classify DROP TABLE as PG001 — it has lost its cgo parser'
            cat probe.json
            exit 1
          fi
          echo 'Image classifies SQL correctly.'

  # ------------------------------------------------------------------------------------------
  # The v1.0.x exposure, asserted in the form a user experiences it.
  #
  # v1.0.0, v1.0.1 and v1.0.2 are Docker actions that run ghcr.io/vikoit/reversibility-engine:v1
  # with no entrypoint and no arguments. When the 1.1.0 image replaced entrypoint.sh with revctl
  # -- which exits 0 with no arguments -- every gate on those tags became a green check over no
  # analysis. `:v1` was repointed at the 1.0.2 manifest on 2026-08-30.
  #
  # TWO JOBS, AND NEITHER GATES THE OTHER. They assert different requirements at different
  # strengths, so ordering them would let the weaker one suppress the stronger. See
  # docs/SPECIFICATION.md §13.
  # ------------------------------------------------------------------------------------------

  # Runs on every event, and is therefore the one that actually stands guard.
  #
  # It needs no pull request because it asserts a property of the image itself: the frozen action
  # invokes the ENTRYPOINT bare, so what that invocation does IS the exposure. entrypoint.sh with
  # no pull request refuses and exits non-zero; revctl with no arguments prints help and exits 0.
  # A single assertion separates the repaired state from the incident state exactly.
  v1-image-is-not-a-no-op:
    name: the :v1 image does not exit 0 on a bare run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pull what the frozen action pulls
        run: docker pull --quiet ghcr.io/vikoit/reversibility-engine:v1

      # Named explicitly rather than inferred from behaviour, because "which entrypoint is this"
      # is the fact the incident turned on and a digest does not express it to a reader.
      - name: The ENTRYPOINT must be the one that analyzes
        run: |
          set -euo pipefail
          got="$(docker image inspect ghcr.io/vikoit/reversibility-engine:v1 --format '{{json .Config.Entrypoint}}')"
          echo "ENTRYPOINT: $got"

          case "$got" in
            *"/usr/local/bin/entrypoint.sh"*) echo 'Analyzing entrypoint present.' ;;
            *)
              echo "::error::ghcr.io/vikoit/reversibility-engine:v1 declares ENTRYPOINT $got, not entrypoint.sh. The frozen v1.0.x Docker action runs this with no arguments; if it is revctl, every @v1.0.x consumer's gate is a green check over no analysis. This is the incident, returned."
              exit 1
              ;;
          esac

      - name: A bare run must not exit 0
        run: |
          set -euo pipefail

          set +e
          docker run --rm ghcr.io/vikoit/reversibility-engine:v1 > out.txt 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "::error::The :v1 image exits 0 when run with no arguments. That is exactly what the frozen v1.0.x action does, so every consumer on those tags has a gate that passes having analyzed nothing."
            cat out.txt
            exit 1
          fi

          echo "Bare run exits $rc, as it must."
          cat out.txt

  # The end-to-end proof, in the shape a consumer actually writes.
  #
  # pull_request only, and that is a property of the thing under test rather than a convenience:
  # the v1.0.2 entrypoint reads .pull_request.base.sha from the event payload and refuses any
  # other event outright. Running it on a push would fail for that reason instead of the gate's,
  # and an assertion that cannot tell those apart asserts nothing -- which is the failure mode
  # this whole workflow exists to catch.
  #
  # So this job proves the action gates, and the job above proves the image is not a no-op on
  # every push. Together they cover it; separately, each says something true.
  v1-0-2-action-fails-a-grade-f-change:
    name: the frozen v1.0.2 action fails a grade F change
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage a destructive migration
        run: |
          set -euo pipefail
          git config user.name 'Action Self Test'
          git config user.email 'selftest@example.invalid'
          mkdir -p .selftest-v1
          cp testdata/fixtures/postgres/PG001_drop_table/migrations/*.sql .selftest-v1/
          git add .selftest-v1
          git commit --quiet --message 'test: stage a destructive fixture for the frozen action'

      # continue-on-error, because a grade F is expected to fail this step and the assertion
      # below is what the job is actually for.
      - id: frozen
        continue-on-error: true
        uses: VIKOIT/reversibility-engine@v1.0.2
        with:
          min-grade: 'A'
          include: '.selftest-v1/*.sql'
          comment: 'false'

      - name: Assert the frozen action refused the change
        run: |
          set -euo pipefail

          if [ '${{ steps.frozen.outcome }}' != 'failure' ]; then
            echo "::error::The v1.0.2 action reported '${{ steps.frozen.outcome }}' for a DROP TABLE change that must grade F. If it passed, :v1 is serving an image whose entrypoint analyzes nothing -- the incident repaired on 2026-08-30 has returned."
            exit 1
          fi

          # Failure alone is not the assertion. The entrypoint exits non-zero for a broken run
          # too, and "it failed" would then be satisfied by the action being broken in a new way.
          # The grade is what distinguishes a working gate from a broken one.
          got='${{ steps.frozen.outputs.grade }}'
          if [ "$got" != 'F' ]; then
            echo "::error::The step failed, but grade was '${got:-<empty>}' rather than F. A failure with no grade is a broken run, not a gate: it would satisfy a bare outcome check while analyzing nothing."
            exit 1
          fi

          echo 'The frozen v1.0.2 action graded the change F and failed the job, as it must.'
