# golangci-lint v2 configuration.
#
# The linter set is chosen to enforce CLAUDE.md §12 mechanically: explicit error handling,
# wrapped errors, and no panics in library code.

version: "2"

run:
  timeout: 5m
  tests: true

# Report everything, every time.
#
# The defaults cap each linter at 50 issues and the same message at 3, which silently hides
# work: a run reporting "18 issues" while holding back a fourth identical errcheck teaches you
# to trust a number that is not the truth. A partial report is the same failure mode as a
# partial analysis, and this repository does not accept it anywhere else either.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint       # §12: errors wrapped with %w
    - forbidigo       # §12: no panic in library code
    - gocritic
    - misspell
    - nilerr          # fail-closed: never return nil after observing an error
    - noctx           # §12: context.Context on anything that blocks
    - nolintlint
    - revive
    - unconvert
    - wrapcheck       # §12: errors carry context across package boundaries

  settings:
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: "no panic in library code (CLAUDE.md §12); return an error instead"
    revive:
      rules:
        - name: exported    # §12: every exported symbol documented
        - name: context-as-argument
        - name: error-strings
        - name: error-return
        - name: indent-error-flow

  exclusions:
    rules:
      # The engine orchestrator owns the single recover() boundary, and cmd/ mains are
      # allowed to abort the process. Neither is library code.
      - path: internal/engine/
        linters: [forbidigo]
      - path: ^cmd/
        linters: [forbidigo, wrapcheck]
      - path: _test\.go$
        linters: [forbidigo, wrapcheck, noctx]

formatters:
  enable:
    - gofmt
    - goimports
