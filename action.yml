name: 'Reversibility Engine'
# The Marketplace caps this at 125 characters, so it stays a single short line. The longer
# statement of what the action does lives in the README, which has no such limit.
description: 'Evaluate if PR database migrations and Kubernetes changes can be safely rolled back.'
author: 'VIKOIT'

branding:
  icon: 'rotate-ccw'
  color: 'purple'

inputs:
  path:
    description: >-
      Git pathspec selecting what to analyze, relative to the repository root. The default is
      the whole tree; narrowing it to the directories that actually hold migrations and
      manifests is the cheapest way to cut noise. Space-separated for several.
    required: false
    default: '.'

  base:
    description: >-
      The git ref to compare against. Left empty it is detected from the event: a pull request
      uses its base commit, a push uses the commit it moved from. On any other event it must be
      given, because there is nothing to infer a comparison from and guessing one would certify
      a range nobody asked about.
    required: false
    default: ''

  gate:
    description: >-
      The worst grade that still passes: A, B, C, or F. The job fails if the certificate grades
      below it. Autonomous agents must use A. F accepts everything and turns this action into a
      reporter rather than a gate.
    required: false
    default: 'A'

  format:
    description: 'Certificate format written to disk: markdown, json, or sarif.'
    required: false
    default: 'markdown'

  comment:
    description: >-
      Post the certificate as a pull request comment, replacing this action's previous one.
      Set to false to run the gate silently, keeping the certificate as a job artifact only.
    required: false
    default: 'true'

  sarif-upload:
    description: >-
      Upload the findings to GitHub code scanning, so they appear on the Security tab and
      inline on the diff. Requires `security-events: write` on the job.
    required: false
    default: 'false'

  config:
    description: >-
      Path to a .reversibility.yml policy file. NOT YET IMPLEMENTED — it arrives in a later
      release, and setting it now is an error rather than a no-op. A policy file that was
      silently ignored would leave a user believing their waivers applied when nothing had
      read them, which is the one direction a safety tool must never fail in.
    required: false
    default: ''

  version:
    description: >-
      Release of revctl to run. Empty means the version of this action that the workflow
      referenced, falling back to the latest release when the action is referenced by a
      branch, a SHA, or a moving major tag — `@v1` has no release of its own, only the
      full versions it points at. Pin a full version here for a build that must be
      reproducible.
    required: false
    default: ''

  binary:
    description: >-
      Path to an existing revctl binary, skipping the download entirely. It exists so this
      repository can test the action against an unreleased build; consumers have no reason
      to set it.
    required: false
    default: ''

  github-token:
    description: >-
      Token used to read the pull request and post the certificate comment. The default
      GITHUB_TOKEN is enough, but the job must grant `pull-requests: write`, and a pull
      request from a fork receives a read-only token that cannot comment.
    required: false
    default: ${{ github.token }}

  # ----------------------------------------------------------------------------------------
  # Deprecated aliases, kept because v1 published them and a gate that breaks on upgrade gets
  # deleted rather than fixed. Each one is read only when its replacement is at its default,
  # so a workflow setting both gets the new name's value rather than a silent merge.
  # ----------------------------------------------------------------------------------------

  min-grade:
    description: 'DEPRECATED — use `gate`.'
    required: false
    default: ''

  include:
    description: 'DEPRECATED — use `path`.'
    required: false
    default: ''

  exclude:
    description: >-
      Space-separated pathspecs to skip, applied on top of `path`. Still supported and not
      deprecated: `path` says where to look and this says what to ignore inside it. The
      defaults are YAML that is configuration for tooling rather than a Kubernetes manifest.
      The analyzer cannot tell "not a manifest" from "a manifest I could not read", and reports
      K8S014/UNKNOWN for both — which is the correct fail-closed answer and the reason to scope
      what it is shown.
    required: false
    default: '.github/** action.yml'

  require-full-coverage:
    description: >-
      DEPRECATED and ignored. Partial coverage now always fails: if any file in a migration
      directory went unanalyzed the job exits 2, with no flag needed. Remove this input. If your
      repository holds ORM-native migrations this engine cannot parse -- Django `.py`, Rails
      `.rb`, Alembic -- render them to SQL and point `path` at the output; that is the supported
      path to a passing grade, and the README documents it with a worked example. An `ignore:`
      entry in `.reversibility.yml` silences the coverage failure instead, and closes the AI
      merge gate while it does: a human may accept a risk, an agent may not inherit it.
    required: false
    default: 'false'
    deprecationMessage: >-
      Partial coverage always fails now; this input is ignored and can be removed.

  fail-on-gate:
    description: >-
      Fail the job when the grade is below `gate`. Set to false to report without blocking.
      A run that could not complete fails the job either way — a broken analysis is never a
      pass.
    required: false
    default: 'true'

outputs:
  grade:
    description: >-
      The certificate grade: A, B, C, F, or N/A. `N/A` means the engine did not analyze this
      change and is making no claim about it — read `outcome` to find out why. A workflow that
      tests `grade != 'F'` will treat N/A as good; test `grade == 'A'` instead.
    value: ${{ steps.certify.outputs.grade }}
  gate-status:
    description: >-
      PASS, FAIL, or NOT_APPLICABLE — whether an autonomous agent may merge. **This, not the
      job's exit code, is what an agent reads.** PASS requires grade A and full coverage, so a
      partially analyzed change fails it even when the job succeeds. Independent of `gate`.
    value: ${{ steps.certify.outputs.gate-status }}
  coverage:
    description: >-
      FULL or PARTIAL — whether the engine read every file it could have. PARTIAL never changes
      the grade; it only closes `gate-status`. Empty for a certificate produced before schema
      1.5.0.
    value: ${{ steps.certify.outputs.coverage }}
  unanalyzed-count:
    description: 'How many files the engine could not read. The certificate names each one.'
    value: ${{ steps.certify.outputs.unanalyzed-count }}
  outcome:
    description: >-
      What the run was able to do at all: `ANALYZED`, `NO_CANDIDATES` (nothing here this engine
      reads — a docs-only pull request), or `UNSUPPORTED_CONTENT` (files that may be migrations
      that no analyzer supports; the job fails with exit 2). Empty for a certificate produced
      before schema 1.5.0.
    value: ${{ steps.certify.outputs.outcome }}
  findings-count:
    description: 'How many findings the certificate carries.'
    value: ${{ steps.certify.outputs.findings-count }}
  certificate-path:
    description: 'Path to the rendered certificate inside the workspace.'
    value: ${{ steps.certify.outputs.certificate-path }}

  # Deprecated aliases, kept for v1 consumers.
  gate:
    description: 'DEPRECATED — use `gate-status`.'
    value: ${{ steps.certify.outputs.gate-status }}
  applicable:
    description: >-
      true when the change touched at least one file an analyzer claims. Equivalent to
      `outcome == 'ANALYZED'`; prefer `outcome`, which distinguishes the two ways this can be
      false.
    value: ${{ steps.certify.outputs.applicable }}
  certificate:
    description: 'DEPRECATED — use `certificate-path`.'
    value: ${{ steps.certify.outputs.certificate-path }}

runs:
  # Composite rather than Docker. The v1 action pulled a container, which pinned it to Linux
  # runners and paid an image pull on every run. A released binary runs anywhere and needs
  # neither a Go toolchain nor a C compiler on the runner — which matters here, because the
  # Postgres analyzer links the real PostgreSQL parser through cgo and building it on demand
  # would cost minutes of every pull request.
  using: 'composite'

  steps:
    - id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BINARY: ${{ inputs.binary }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        FALLBACK_REPOSITORY: ${{ github.repository }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: bash "$GITHUB_ACTION_PATH/action/resolve.sh"

    # Keyed on the exact version and asset, so a cache entry can never serve a different
    # release or platform than the one that was asked for. An unpinned run emits no key and
    # skips the cache entirely, because a key naming "latest" would freeze the first binary it
    # ever cached.
    - if: steps.resolve.outputs.cache-key != ''
      uses: actions/cache@v4
      with:
        path: ${{ steps.resolve.outputs.install-dir }}
        key: ${{ steps.resolve.outputs.cache-key }}

    - if: steps.resolve.outputs.needs-download == 'true'
      shell: bash
      env:
        ASSET: ${{ steps.resolve.outputs.asset }}
        CHECKSUMS_URL: ${{ steps.resolve.outputs.checksums-url }}
        DOWNLOAD_URL: ${{ steps.resolve.outputs.download-url }}
        INSTALL_DIR: ${{ steps.resolve.outputs.install-dir }}
        REVCTL: ${{ steps.resolve.outputs.revctl }}
      run: bash "$GITHUB_ACTION_PATH/action/install.sh"

    - id: certify
      shell: bash
      env:
        REVCTL: ${{ steps.resolve.outputs.revctl }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_GATE: ${{ inputs.gate }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_SARIF_UPLOAD: ${{ inputs.sarif-upload }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_MIN_GRADE: ${{ inputs.min-grade }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_FAIL_ON_GATE: ${{ inputs.fail-on-gate }}
        # Deprecated and ignored, and passed through anyway. certify.sh warns when it is set,
        # and a warning it cannot receive is the same silence the deprecation exists to break.
        # That is not hypothetical: v1.2.2 repaired the corrupted condition inside certify.sh
        # while this line was still missing, so the warning stayed unreachable one layer
        # further out. Held now by TestActionInputsAreWiredAndRead.
        INPUT_REQUIRE_FULL_COVERAGE: ${{ inputs.require-full-coverage }}
      run: bash "$GITHUB_ACTION_PATH/action/certify.sh"

    # always(): a failed gate must still post its explanation. A pull request with no
    # certificate looks identical to one that was never analyzed.
    - if: always() && inputs.comment == 'true' && steps.certify.outputs.markdown-path != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MARKDOWN_PATH: ${{ steps.certify.outputs.markdown-path }}
      run: bash "$GITHUB_ACTION_PATH/action/comment.sh"

    - if: always() && inputs.sarif-upload == 'true' && steps.certify.outputs.sarif-path != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.certify.outputs.sarif-path }}
        category: reversibility-engine
