#
# Resource-type catalog for the AWS Terraform provider.
#
# THE DISCRIMINATOR. A resource is STATEFUL when destroying it destroys data, destroys an
# identity that re-applying the same configuration cannot recreate, or destroys a recovery
# capability a future rollback would depend on. Everything else is STATELESS.
#
# The third clause is why snapshots are here: deleting one destroys no running system, it
# destroys the undo. It is the same family as turning off deletion protection.
#
# STATELESS entries are not filler. An unclassified deleted type grades F, so the network, IAM,
# load-balancing and compute groups below are what stand between a new user and an immediate
# failing gate on an ordinary plan.
#
# Every entry MUST carry class and evidence. A missing evidence link fails the build — see
# TestEveryEntryCarriesClassAndEvidence. Evidence is the provider documentation for the type,
# which is where a reviewer checks the claim.
#
# Adding a type: open a pull request. `revctl catalog scan` generates candidates from a provider
# schema, but nothing is ever merged automatically and nothing is ever fetched during analysis.

